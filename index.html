<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Floppy Bird - a lightweight browser game built with HTML, CSS and JavaScript." />
  <title>Floppy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Floppy Bird</h1>
      <div class="stats"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div>
    </header>
    <section class="game-shell" aria-label="Floppy Bird game">
      <canvas id="game" width="420" height="680"></canvas>
      <div id="overlay" class="overlay">
        <div class="card">
          <div class="bird-icon">🐤</div>
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Press Space, click, or tap to flap.</p>
          <button id="startBtn">Start Game</button>
        </div>
      </div>
    </section>
    <p class="hint">Space / ↑ / click / tap to flap · P to pause</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
